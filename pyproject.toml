[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job51-cli"
version = "0.1.0"
description = "RE scaffold for 前程无忧 51job (com.job.android) — unpacked s.h.e.l.l shell, API map (sign TODO)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "weixingyu" }]
keywords = ["51job", "qiancheng", "reverse-engineering", "unpacking", "dex"]
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://github.com/1013503897/job51-cli"

[tool.setuptools]
packages = ["job51cli"]
